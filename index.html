<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#cde1da">
    <title>Capivara AR — Visualizador 3D e Realidade Aumentada</title>

    <!-- Carregamento mais rápido: abre a conexão com o CDN e já baixa o modelo e os módulos em paralelo -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="capybara_low_poly.glb" as="fetch" crossorigin>
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js">

    <!-- Importmap: resolve os imports "nus" (from 'three') para URLs reais de CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <link rel="stylesheet" type="text/css" href="sla.css">

    <!-- Diagnóstico: roda mesmo que o app.js falhe ao carregar -->
    <script>
        (function () {
            function show(msg) {
                var el = document.getElementById('loading');
                if (!el) return;
                el.classList.add('error');
                el.style.display = 'flex';
                el.style.opacity = '1';
                el.style.pointerEvents = 'auto';
                var text = document.getElementById('loading-text') || el;
                text.textContent = msg;
            }
            if (location.protocol === 'file:') {
                window.addEventListener('DOMContentLoaded', function () {
                    show('Esta página foi aberta direto do arquivo (file://) e o navegador bloqueia os módulos 3D. ' +
                         'Abra por um servidor: na pasta do projeto rode "python3 -m http.server 8000" e acesse http://localhost:8000');
                });
            }
            window.addEventListener('error', function (e) {
                if (!e || !e.message) return;
                var el = document.getElementById('loading');
                // Depois que o modelo carregou, erros de scripts externos (CDN) não podem
                // cobrir a tela: vão só para o console. Antes disso, mostra para diagnóstico.
                if (!el || el.classList.contains('done') || el.style.display === 'none') {
                    console.error('Erro (não fatal):', e.message, e.filename || '');
                    return;
                }
                show('Erro ao iniciar: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''));
            });
        })();
    </script>
</head>
<body>
    <div id="info">
        <strong>Capivara 3D</strong>
        <span id="info-text">Arraste para girar, pince ou role para dar zoom</span>
    </div>

    <div id="loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div id="loading-text">Carregando modelo… 0%</div>
        <div class="bar" aria-hidden="true"><i id="loading-bar"></i></div>
    </div>

    <!-- Aviso exibido quando o dispositivo/navegador não permite acesso à câmera -->
    <div id="ar-warning" role="alert"></div>

    <!-- O botão "Ver em RA" é injetado aqui via JS -->
    <div id="ar-button-container"></div>

    <!-- type="module" é obrigatório porque app.js usa import/export -->
    <script type="module" src="app.js"></script>
</body>
</html>
